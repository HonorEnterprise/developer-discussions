name: Discussions Runner

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: 'Comment ID to mark as answer'
        required: true
        default: 'DC_kwDOVkf2yM4BKHFG'

permissions:
  discussions: write

jobs:
  mark-answer:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Comment as Answer via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
        run: |
          python3 -c "
          import urllib.request, json, os

          token = os.environ['GH_TOKEN']
          comment_id = os.environ['COMMENT_ID']
          url = 'https://api.github.com/graphql'
          query = '''
          mutation MarkAnswer(\$id: ID!) {
            markDiscussionCommentAsAnswer(input: {id: \$id}) {
              discussion {
                id
                answer {
                  id
                  author {
                    login
                  }
                }
              }
            }
          }
          '''
          req = urllib.request.Request(url, data=json.dumps({'query': query, 'variables': {'id': comment_id}}).encode('utf-8'), headers={
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json'
          })
          try:
            with urllib.request.urlopen(req) as resp:
              print(resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
            print(f'HTTP {e.code}: {e.read().decode(\"utf-8\")}')
          "
